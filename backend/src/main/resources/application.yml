server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: weekly-report
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/weekly_report}
    username: ${SPRING_DATASOURCE_USERNAME:weekly}
    password: ${SPRING_DATASOURCE_PASSWORD:weekly}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 메모 그림 한 장 상한과 같다. 섬네일이 함께 오므로 요청 전체는 조금 더 받는다.
      max-file-size: 5MB
      max-request-size: 6MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:3000}
  jwt:
    # 비워두면 기동할 때 임시 키를 만든다. 재시작마다 로그인이 풀리므로
    # 운영에서는 반드시 채운다.  openssl rand -base64 32
    secret: ${APP_JWT_SECRET:}
    ttl: ${APP_JWT_TTL:12h}
  # 메모 그림 한도. 최악이면 사람 수 × quota 만큼 DB 가 커진다. 디스크와 백업 시간에 맞춘다.
  # 한 장 상한을 5MB 보다 올리려면 위 multipart 와 nginx(client_max_body_size 8m)도 함께 올린다.
  memo-image:
    max-bytes: ${APP_MEMO_IMAGE_MAX_BYTES:5MB}
    max-per-memo: ${APP_MEMO_IMAGE_MAX_PER_MEMO:50}
    quota-per-user: ${APP_MEMO_IMAGE_QUOTA:300MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.khs.weeklyreport: INFO
