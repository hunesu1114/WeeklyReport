name: weekly-report

services:
  db:
    image: postgres:16-alpine
    container_name: weekly-report-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weekly_report}
      POSTGRES_USER: ${POSTGRES_USER:-weekly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weekly}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weekly} -d ${POSTGRES_DB:-weekly_report}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # 이름을 운영과 맞춘다. frontend 의 nginx 가 이 이름으로 찾아오기 때문이다
    # (짧은 이름 'backend' 는 공용망에서 다른 앱과 충돌한다).
    container_name: weekly-report-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-weekly_report}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-weekly}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-weekly}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://localhost:3000}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    # 헬스체크는 이미지에 들어 있다(backend/Dockerfile).
    # Spring 기동 + Flyway 마이그레이션 때문에 start_period 가 넉넉히 잡혀 있다.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: weekly-report-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  db-data:
