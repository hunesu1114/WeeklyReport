<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" role="img" aria-label="MW">
  <!--
    월~금 다섯 칸. 보고하는 금요일만 칠했다 (BrandMark.vue 와 같은 그림).
    바탕이 없으니 평일 칸 색을 탭 테마에 맞춰 바꾼다.
  -->
  <style>
    .day { fill: #14171c; opacity: 0.32; }
    .fri { fill: #16a34a; }
    @media (prefers-color-scheme: dark) {
      .day { fill: #ffffff; opacity: 0.42; }
      .fri { fill: #34d17f; }
    }
  </style>
  <rect class="day" x="0" y="3" width="2.6" height="14" rx="1.3"/>
  <rect class="day" x="4.35" y="3" width="2.6" height="14" rx="1.3"/>
  <rect class="day" x="8.7" y="3" width="2.6" height="14" rx="1.3"/>
  <rect class="day" x="13.05" y="3" width="2.6" height="14" rx="1.3"/>
  <rect class="fri" x="17.4" y="3" width="2.6" height="14" rx="1.3"/>
</svg>
