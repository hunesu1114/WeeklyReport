<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>주간보고/칸반</title>
    <meta name="description" content="주간보고를 작성해 엑셀로 내려받고, 칸반 보드로 할 일을 관리합니다." />

    <!-- SVG 를 먼저 두면 지원하는 브라우저가 그것을 쓴다. 나머지는 PNG 로 내려간다. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 모바일 주소창 색. 라이트/다크 각각 배경색과 맞춘다. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1014" />
  </head>
