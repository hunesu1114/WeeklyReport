# 앱 nginx. 정적 파일 서빙 + /api 백엔드 프록시.
#
# TLS 종단과 도메인 라우팅은 앞단 edge 프록시가 담당한다. 여기서는 하지 않는다.
# 개발용 docker-compose.yml 에서는 이 컨테이너가 유일한 진입점이라 3000 으로 직접 붙는다.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # 엑셀 다운로드만 나가고 업로드는 없다. 앞단 edge 와 값을 맞춰 둔다.
    # 앞단이 더 작으면 거기서 먼저 413 이 나 원인을 찾기 어려워진다.
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 도커 내장 DNS. upstream 을 변수로 두면 nginx 가 기동 시점이 아니라
    # 요청 시점에 이름을 해석한다.
    #
    # 이게 없으면 backend 컨테이너가 내려간 상태에서 이 nginx 가 아예 기동하지 못하고,
    # 정적 파일조차 못 내려준다. valid 를 짧게 둬서 재배포로 IP 가 바뀌어도 곧 따라간다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend;

    location /api/ {
        proxy_pass         http://$backend_upstream:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 뒤쪽이 원래 요청이 https 였음을 알아야 리다이렉트를 http 로 만들지 않는다.
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 엑셀은 통째로 만들어 한 번에 내려간다. 버퍼링을 꺼서
        # 파일이 커져도 nginx 가 임시 파일로 받아 적었다가 보내지 않게 한다.
        proxy_buffering    off;
    }

    # 배포 확인용. edge → 이 nginx → backend → DB 경로 전체가 살아 있는지 본다.
    location /actuator/health {
        proxy_pass         http://$backend_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log         off;
    }

    # 해시가 붙은 정적 자산은 오래 캐시해도 안전하다.
    #
    # add_header 는 하위 블록에서 하나라도 선언하면 상위 것을 상속하지 않는다.
    # 그래서 보안 헤더를 여기서 다시 적어 준다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "no-referrer" always;
        try_files $uri =404;
    }

    # SPA 라우팅. index.html 은 캐시하지 않아야 배포가 바로 반영된다.
    location / {
        add_header Cache-Control          "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
